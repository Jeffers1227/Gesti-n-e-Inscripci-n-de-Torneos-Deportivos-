spring.application.name=demo

server.port=8090
# Clave para firmar JWT (Configuración del Laboratorio)
app.jwt.secret=EsteEsUnSecretoMuyLargoParaFirmarTokensJwtDeLaboratorio1234567890
app.jwt.expiration-minutes=60


spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true