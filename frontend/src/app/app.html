<div class="app-shell" *ngIf="auth.isAuthenticated(); else authOutlet">
  
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon-glow">
        <span class="brand-mark">🏆</span>
      </div>
      <div class="brand-text">
        <h2>Torneos Deportivos</h2>
      </div>
    </div>

    <nav class="nav">
      <p class="nav-title">MENÚ PRINCIPAL</p>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">📊</span> Panel de Control
      </a>
      <a routerLink="/eventos" routerLinkActive="active">
        <span class="nav-icon">⚽</span> Torneos y Eventos
      </a>
      <a routerLink="/participantes" routerLinkActive="active">
        <span class="nav-icon">🏃‍♂️</span> Atletas y Equipos
      </a>
      <a routerLink="/inscripciones" routerLinkActive="active">
        <span class="nav-icon">🎟️</span> Inscripciones
      </a>
      <a routerLink="/canchas" routerLinkActive="active">
        <span class="nav-icon">🏟️</span> Sedes y Canchas
      </a>
      <a routerLink="/contactos" routerLinkActive="active">
        <span class="nav-icon">📬</span> Bandeja de Mensajes
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar">A</div>
        <div>
          <span class="user-name">Administrador</span>
          <span class="user-role">Online</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-wrapper">
    
    <header class="topbar">
      <div class="topbar-title">
        <h1>Centro de Administración</h1>
        <p>Sistema de gestión deportiva en tiempo real</p>
      </div>
      <div class="topbar-actions">
        <div class="api-badge">
          <span class="pulse-dot"></span>
          API: localhost:8090
        </div>
        <button class="btn-logout" type="button" (click)="logout()">
          <span>Cerrar Sesión</span> 🚪
        </button>
      </div>
    </header>

    <section class="content-scrollable">
      <div class="content-inner">
        <router-outlet></router-outlet>
      </div>
    </section>
  </div>
</div>

<ng-template #authOutlet>
  <router-outlet></router-outlet>
</ng-template>
